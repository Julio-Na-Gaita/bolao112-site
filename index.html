<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
       <link rel="icon" type="image/png" href="favicon.png">
    <title>Bolão 112 F.C</title>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="favicon.png">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut, updatePassword, createUserWithEmailAndPassword, sendPasswordResetEmail, setPersistence, browserLocalPersistence, browserSessionPersistence } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, collection, getDocs, doc, getDoc, setDoc, updateDoc, query, where, deleteDoc, writeBatch, addDoc, onSnapshot, orderBy, enableIndexedDbPersistence, arrayUnion, arrayRemove } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = { apiKey: "AIzaSyAEkEE2X5hWIqopoJ0D9jFzCjJHKR8b82k", authDomain: "bolao112fc.firebaseapp.com", projectId: "bolao112fc", storageBucket: "bolao112fc.firebasestorage.app", messagingSenderId: "131329454158", appId: "1:131329454158:web:983e4544dd651ec942131f", measurementId: "G-5SGWJE6EKK" };
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // --- 1. VARIÁVEIS GLOBAIS (ESTÃO NO TOPO PARA EVITAR ERROS) ---
        let currentUser = null;
        let currentRankingData = [];
        let compMap = {}; 
        let globalServerCounts = {};
        let cachedMatches = [];

        // --- 2. SISTEMA DE REMOTE CONFIG (BANNERS & MANUTENÇÃO) ---
        const initRemoteConfig = () => {
            onSnapshot(doc(db, "settings", "config"), (docSnap) => {
                if (docSnap.exists()) {
                    const config = docSnap.data();
                    const maintScreen = document.getElementById('maintenanceScreen');
                    const alertBanner = document.getElementById('alertBanner');
                    
                    if (!maintScreen || !alertBanner) return;

                    // Bloqueio
                    if (config.banner_active && config.banner_blocking) {
                        const t = document.getElementById('maintTitle'); if(t) t.innerText = config.banner_title || "EM MANUTENÇÃO";
                        const m = document.getElementById('maintMessage'); if(m) m.innerText = config.banner_message || "Voltamos logo!";
                        maintScreen.classList.remove('hidden');
                        alertBanner.classList.add('hidden');
                    } else {
                        maintScreen.classList.add('hidden');
                    }
                    // Aviso
                    if (config.banner_active && !config.banner_blocking) {
                        const t = document.getElementById('alertTitle'); if(t) t.innerText = config.banner_title || "AVISO";
                        const m = document.getElementById('alertMessage'); if(m) m.innerText = config.banner_message || "";
                        alertBanner.classList.remove('hidden');
                    } else {
                        alertBanner.classList.add('hidden');
                    }
                }
            });
        };
        initRemoteConfig();

        // --- 3. PERSISTÊNCIA E CACHE ---
        enableIndexedDbPersistence(db).catch((err) => console.log("Persistência:", err.code));

        // --- 4. FUNÇÕES AUXILIARES (IMAGEM) ---
        const getAvatarUrl = (base64, name) => {
            if (base64 && base64.trim() !== "") return `data:image/jpeg;base64,${base64}`;
            const seed = (name || "user").trim();
            const bgColors = ["b6e3f4", "c0aede", "d1d4f9", "ffdfbf", "fdcdc5"]; 
            const bg = bgColors[seed.length % bgColors.length];
            return `https://api.dicebear.com/7.x/adventurer/png?seed=${seed}&backgroundColor=${bg}`;
        };

        const compressImage = (file) => {
            return new Promise((resolve) => {
                const reader = new FileReader(); reader.readAsDataURL(file);
                reader.onload = (e) => {
                    const img = new Image(); img.src = e.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        const scale = 500 / img.width; canvas.width = 500; canvas.height = img.height * scale;
                        const ctx = canvas.getContext('2d'); ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                        resolve(canvas.toDataURL('image/jpeg', 0.7).split(',')[1]);
                    };
                };
            });
        };

        // --- 5. LÓGICA DE LOGIN ---
        window.handleLogin = async () => {
            const btn = document.getElementById('btnLoginAction');
            const originalText = btn.innerHTML;
            btn.innerHTML = `<i class="fas fa-circle-notch fa-spin"></i>`;
            btn.disabled = true;

            const user = document.getElementById('userInput').value.trim().toLowerCase();
            const pass = document.getElementById('passInput').value;
            const remember = document.getElementById('rememberMe').checked;

            if (!user || !pass) { alert("Preencha tudo."); btn.innerHTML = originalText; btn.disabled = false; return; }

            try {
                const mode = remember ? browserLocalPersistence : browserSessionPersistence;
                await setPersistence(auth, mode);
                await signInWithEmailAndPassword(auth, `${user}@bolao112.com`, pass);
            } catch (e) {
                console.error(e);
                alert("Erro de login. Verifique seus dados.");
                btn.innerHTML = originalText; btn.disabled = false;
            }
        };

        // --- 6. MONITOR DE AUTENTICAÇÃO ---
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                const userDoc = await getDoc(doc(db, "users", user.uid));
                if (userDoc.exists()) {
                    const d = userDoc.data();
                    // Verifica Trial
                    if (d.isTrial && d.trialValidUntil) {
                        const now = new Date();
                        if (now > d.trialValidUntil.toDate()) {
                            const months = ["Jan", "Fev", "Mar", "Abr", "Mai", "Jun", "Jul", "Ago", "Set", "Out", "Nov", "Dez"];
                            const isPaid = d.payments && d.payments[months[now.getMonth()]] === true;
                            if (!isPaid) {
                                alert("Seu período de teste acabou. Regularize sua mensalidade.");
                                signOut(auth); return;
                            } else {
                                await updateDoc(doc(db, "users", user.uid), { isTrial: false, name: d.name.replace(" (Teste ⏳)", "") });
                                location.reload(); return;
                            }
                        }
                    }
                    try { await updateDoc(doc(db, "users", user.uid), { appVersion: "Web v1.6.1" }); } catch(e){}
                }

                currentUser = user;
                document.getElementById('loginScreen').classList.add('hidden');
                document.getElementById('mainHeader').classList.remove('hidden');
                document.getElementById('mainScreens').classList.remove('hidden');
                document.getElementById('bottomNav').classList.remove('hidden');
                document.getElementById('btnLogout').classList.remove('hidden');
                
                if(window.showTab) { showTab('matches'); if(window.calculatePot) calculatePot(); }
            } else {
                currentUser = null;
                document.getElementById('mainHeader').classList.add('hidden');
                document.getElementById('loginScreen').classList.remove('hidden');
                document.getElementById('mainScreens').classList.add('hidden');
                document.getElementById('bottomNav').classList.add('hidden');
            }
        });

        // --- 7. CARROSEL DE IMAGENS ---
        const appScreenshots = ["print1.jpeg", "print2.jpeg", "print3.jpeg"];
        let currentImgIdx = 0;
        const imgEl = document.getElementById('showcaseImg');
        if (imgEl) {
            imgEl.src = appScreenshots[0];
            setInterval(() => {
                imgEl.style.opacity = 0;
                setTimeout(() => {
                    currentImgIdx = (currentImgIdx + 1) % appScreenshots.length;
                    imgEl.src = appScreenshots[currentImgIdx];
                    imgEl.style.opacity = 1;
                }, 500);
            }, 4000);
        }

        // --- 8. HANDLERS DE UI E MODAIS ---
        window.showTab = (tab) => {
            const tabs = ['matches', 'ranking', 'rules', 'profile'];
            tabs.forEach(t => {
                document.getElementById(`${t}Screen`).classList.add('hidden');
                const nav = document.getElementById(`nav-${t}`);
                if(nav) nav.classList.replace('text-[#006400]', 'text-gray-400');
            });
            document.getElementById(`${tab}Screen`).classList.remove('hidden');
            const activeNav = document.getElementById(`nav-${tab}`);
            if(activeNav) activeNav.classList.replace('text-gray-400', 'text-[#006400]');
            
            if(tab === 'matches') loadMatches();
            if(tab === 'ranking') loadRanking();
            if(tab === 'rules') renderRules();
            if(tab === 'profile') loadProfile();
        };

        // --- 9. FUNÇÕES DE RECUPERAÇÃO E CADASTRO ---
        document.getElementById('btnForgotPass').onclick = () => {
            const m = document.getElementById('modalOverlay'); m.classList.remove('hidden');
            document.getElementById('modalContainer').innerHTML = `
                <div class="bg-white p-6 relative w-full max-w-sm rounded shadow-xl text-center">
                    <button onclick="closeModal()" class="absolute top-2 right-2 text-gray-400 p-2"><i class="fas fa-times"></i></button>
                    <h3 class="text-[#006400] font-black uppercase text-lg mb-2">Recuperar</h3>
                    <input type="text" id="recoverUser" placeholder="Usuário" class="w-full p-2 border rounded mb-2 text-center">
                    <div id="hintRes" class="hidden bg-orange-50 p-2 mb-2"><p class="text-xs text-orange-600 font-bold">DICA:</p><p id="hintTxt" class="font-black"></p></div>
                    <button id="btnSearch" class="w-full bg-[#006400] text-white py-2 rounded font-bold">BUSCAR</button>
                </div>`;
            document.getElementById('btnSearch').onclick = async () => {
                const u = document.getElementById('recoverUser').value.trim();
                if(!u) return alert("Digite o usuário");
                const snap = await getDocs(query(collection(db, "users"), where("username", "==", u)));
                if(!snap.empty) {
                    const d = snap.docs[0].data();
                    if(d.passwordHint) {
                        document.getElementById('hintTxt').innerText = d.passwordHint;
                        document.getElementById('hintRes').classList.remove('hidden');
                    } else alert("Sem dica cadastrada.");
                } else alert("Usuário não encontrado.");
            };
        };

        document.getElementById('btnOpenRegister').onclick = () => {
            const m = document.getElementById('modalOverlay'); m.classList.remove('hidden');
            document.getElementById('modalContainer').innerHTML = `
                <div class="bg-white p-6 relative w-full max-w-sm rounded shadow-xl">
                    <button onclick="closeModal()" class="absolute top-2 right-2 text-gray-400"><i class="fas fa-times"></i></button>
                    <h3 class="text-[#006400] font-black uppercase text-center mb-4">Nova Conta</h3>
                    <input id="regName" placeholder="Nome" class="w-full border p-2 mb-2 rounded">
                    <input id="regUser" placeholder="Usuário (sem espaço)" class="w-full border p-2 mb-2 rounded">
                    <input id="regHint" placeholder="Dica de Senha" class="w-full border p-2 mb-2 rounded">
                    <input type="password" id="regPass" placeholder="Senha (min 6)" class="w-full border p-2 mb-4 rounded">
                    <button id="btnDoReg" class="w-full bg-[#006400] text-white py-2 rounded font-bold">CADASTRAR</button>
                </div>`;
            
            document.getElementById('btnDoReg').onclick = async () => {
                const n = document.getElementById('regName').value.trim();
                const u = document.getElementById('regUser').value.trim().toLowerCase();
                const p = document.getElementById('regPass').value;
                const h = document.getElementById('regHint').value.trim();
                if(!n || !u || p.length < 6 || u.includes(" ")) return alert("Dados inválidos.");
                
                try {
                    const snap = await getDoc(doc(db, "whitelist", u));
                    let isTrial = false; let validUntil = null; let fName = n;
                    if(!snap.exists()) {
                        if(!confirm("Criar conta de TESTE (7 dias)?")) return;
                        isTrial = true; fName += " (Teste ⏳)";
                        const d = new Date(); d.setDate(d.getDate()+7); validUntil = d;
                    }
                    const res = await createUserWithEmailAndPassword(auth, `${u}@bolao112.com`, p);
                    await setDoc(doc(db, "users", res.user.uid), {
                        name: fName, username: u, createdAt: new Date(), isAdmin: false, debts: 0, payments: {},
                        appVersion: "Web v1.6.1", passwordHint: h, isTrial, trialValidUntil: validUntil
                    });
                    alert("Conta criada!"); closeModal();
                } catch(e) { alert("Erro ao criar (Usuário já existe?)."); }
            };
        };

        // --- 10. FUNCIONALIDADES PRINCIPAIS ---
        async function loadMatches() {
            const container = document.getElementById('matchesScreen');
            document.getElementById('progressBar').classList.remove('hidden');
            try {
                const [matchesSnap, guessesSnap, uSnap, commentsSnap] = await Promise.all([
                    getDocs(collection(db, "matches")),
                    getDocs(collection(db, "guesses")),
                    getDocs(collection(db, "users")),
                    getDocs(collection(db, "match_comments"))
                ]);

                // Processamento de Dados (Simplificado para performance)
                const totalParticipants = uSnap.size || 1;
                const myVotesMap = {};
                const statsMap = {};
                guessesSnap.forEach(d => {
                    const g = d.data();
                    if(g.userId === currentUser.uid) myVotesMap[g.matchId] = g.teamSelected;
                    if(!statsMap[g.matchId]) statsMap[g.matchId] = { A: 0, B: 0 };
                    // Lógica simplificada de contagem
                });

                // Server Counts (Chat)
                globalServerCounts = {};
                commentsSnap.forEach(d => { const mid = d.data().matchId; globalServerCounts[mid] = (globalServerCounts[mid]||0)+1; });

                const now = new Date();
                let matches = [];
                matchesSnap.forEach(d => {
                    const m = {id:d.id, ...d.data()};
                    if(m.deadline) {
                        m.date = m.deadline.toDate();
                        m.expired = now > m.date;
                        matches.push(m);
                    }
                });
                matches.sort((a,b) => a.date - b.date);
                window.cachedMatches = matches;

                // Renderiza Listas
                let open = matches.filter(m => !m.expired && !m.winner);
                let waiting = matches.filter(m => m.expired && !m.winner);
                let finished = matches.filter(m => m.winner);
                finished.sort((a,b) => b.date - a.date); // Recentes primeiro

                // Montagem do HTML (Resumo)
                let html = `<div class="p-2 text-center text-xs font-bold text-gray-500 mb-2">JOGOS ABERTOS: ${open.length}</div>`;
                html += await renderMatchList(open, myVotesMap);
                
                if(waiting.length) {
                    html += `<div class="p-2 text-center text-xs font-bold text-yellow-600 mt-4 border-t">AGUARDANDO RESULTADO</div>`;
                    html += await renderMatchList(waiting, myVotesMap);
                }
                if(finished.length) {
                    html += `<div class="p-2 text-center text-xs font-bold text-red-600 mt-4 border-t">FINALIZADOS</div>`;
                    html += await renderMatchList(finished, myVotesMap);
                }
                
                container.innerHTML = html;
                window.updateBadges();

            } catch(e) { console.error(e); }
            document.getElementById('progressBar').classList.add('hidden');
        }

        async function renderMatchList(list, myVotes) {
            let html = "";
            for(const m of list) {
                const myVote = myVotes[m.id];
                const dateStr = m.date.toLocaleTimeString([], {day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit'});
                const btnAClass = myVote === m.teamA ? "bg-[#006400] text-white border-2 border-[#FFD700]" : "bg-gray-100 text-gray-800";
                const btnBClass = myVote === m.teamB ? "bg-[#006400] text-white border-2 border-[#FFD700]" : "bg-gray-100 text-gray-800";
                const disabled = m.expired ? "disabled opacity-80" : "";
                const winnerDisplay = m.winner ? `<div class="text-center font-black text-[#006400] text-sm mt-2">VENCEDOR: ${m.winner}</div>` : "";

                // Chat Badge
                const sCount = globalServerCounts[m.id] || 0;
                const lCount = parseInt(localStorage.getItem(`read_count_${m.id}`)||0);
                const badge = sCount > lCount ? `<span class="absolute -top-2 -right-2 bg-red-600 text-white text-[8px] w-4 h-4 rounded-full flex items-center justify-center">${sCount > 9 ? '+' : sCount}</span>` : "";

                html += `
                <div class="card-cut bg-white border-l-4 ${m.expired ? 'border-gray-400' : 'border-[#006400]'} mb-4 p-3 relative">
                    <div class="flex justify-between mb-2">
                        <span class="text-[10px] font-bold text-gray-400">${m.competition}</span>
                        <span class="text-[10px] font-bold text-red-600">${dateStr}</span>
                    </div>
                    <div class="flex items-center justify-between gap-2">
                         <button onclick="window.vote('${m.id}', '${m.teamA}')" ${disabled} class="flex-1 py-3 rounded-lg flex flex-col items-center transition-all ${btnAClass} shadow-sm btn-press">
                            <span class="font-bold text-xs text-center leading-tight">${m.teamA}</span>
                         </button>
                         <span class="font-black text-gray-300">X</span>
                         <button onclick="window.vote('${m.id}', '${m.teamB}')" ${disabled} class="flex-1 py-3 rounded-lg flex flex-col items-center transition-all ${btnBClass} shadow-sm btn-press">
                            <span class="font-bold text-xs text-center leading-tight">${m.teamB}</span>
                         </button>
                    </div>
                    ${winnerDisplay}
                    <div class="flex justify-end mt-2 gap-3">
                         <button onclick="window.openMatchComments('${m.id}', '${m.teamA}', '${m.teamB}', '${m.winner||''}')" class="relative text-gray-500 hover:text-[#006400]">
                            <i class="fas fa-comment-dots text-lg"></i>${badge}
                         </button>
                         <button onclick="window.openVoters('${m.id}', '${m.teamA}', '${m.teamB}', '', '', ${m.expired}, '${m.winner||''}')" class="text-[#006400]">
                            <i class="fas ${m.expired ? 'fa-eye' : 'fa-users'} text-lg"></i>
                         </button>
                    </div>
                </div>`;
            }
            return html;
        }

        window.vote = async (mid, team) => {
            if(!currentUser) return;
            // Otimista
            loadMatches(); // Recarrega para pintar (rápido com cache)
            await setDoc(doc(db, "guesses", `${mid}_${currentUser.uid}`), {
                matchId: mid, userId: currentUser.uid, teamSelected: team, timestamp: new Date()
            });
            loadMatches(); // Confirma
        };

        window.updateBadges = () => {
             // Lógica simplificada de badges
             let count = 0;
             cachedMatches.forEach(m => {
                 const s = globalServerCounts[m.id] || 0;
                 const l = parseInt(localStorage.getItem(`read_count_${m.id}`)||0);
                 if(s > l) count++;
             });
             const bell = document.getElementById('btnBell');
             const old = bell.querySelector('.bell-badge'); if(old) old.remove();
             if(count > 0) bell.innerHTML += `<div class="bell-badge">${count}</div>`;
        };

        // --- RANKING SIMPLIFICADO ---
        async function loadRanking() {
            const el = document.getElementById('rankingListContent');
            el.innerHTML = '<div class="text-center p-4">Carregando...</div>';
            
            const [uSnap, gSnap, mSnap] = await Promise.all([
                getDocs(collection(db, "users")),
                getDocs(collection(db, "guesses")),
                getDocs(collection(db, "matches"))
            ]);

            const matches = [];
            mSnap.forEach(d => { const m=d.data(); if(m.winner) matches.push({id:d.id, ...m}); });
            
            const guesses = [];
            gSnap.forEach(d => guesses.push(d.data()));

            let ranking = [];
            uSnap.forEach(doc => {
                const u = doc.data();
                let pts = 0;
                let debts = u.debts || 0;
                matches.forEach(m => {
                    const g = guesses.find(x => x.userId === doc.id && x.matchId === m.id);
                    if(g && g.teamSelected === m.winner) {
                        pts += (m.round && m.round.toLowerCase() === 'final') ? 6 : 3;
                    }
                });
                pts -= (debts * 3);
                ranking.push({ name: u.name, pts, debts, uid: doc.id, photo: u.photoBase64 });
            });

            ranking.sort((a,b) => {
                if(b.pts !== a.pts) return b.pts - a.pts;
                return a.debts - b.debts;
            });

            currentRankingData = ranking; // Para modal
            
            let html = "";
            ranking.forEach((u, i) => {
                const bg = i < 3 ? "bg-yellow-50" : "bg-white";
                const rank = i+1;
                html += `
                <div class="flex items-center p-3 border-b ${bg}" onclick="showModalPhoto(${i})">
                    <div class="w-8 font-bold text-gray-500">${rank}º</div>
                    <div class="flex-1 font-bold text-sm truncate">${u.name}</div>
                    <div class="w-8 text-center text-xs text-red-500 font-bold">${u.debts > 0 ? u.debts : ''}</div>
                    <div class="w-10 text-right font-black text-[#006400]">${u.pts}</div>
                </div>`;
            });
            el.innerHTML = html;
        }

        // --- OUTRAS JANELAS E UTILITÁRIOS ---
        window.closeModal = () => document.getElementById('modalOverlay').classList.add('hidden');
        window.calculatePot = async () => {
             const snap = await getDocs(collection(db, "users"));
             let total = 0;
             snap.forEach(d => {
                 const p = d.data().payments;
                 if(p) total += Object.values(p).filter(Boolean).length;
             });
             const potVal = document.getElementById('potValue');
             if(potVal) potVal.innerText = (total * 10).toLocaleString('pt-br',{style:'currency',currency:'BRL'});
             const partyVal = document.getElementById('partyValue');
             if(partyVal) partyVal.innerText = (total * 5).toLocaleString('pt-br',{style:'currency',currency:'BRL'});
        };

        window.openMatchComments = async (mid, ta, tb, winner) => {
            const m = document.getElementById('modalOverlay'); m.classList.remove('hidden');
            const c = document.getElementById('modalContainer');
            c.innerHTML = `<div class="bg-white h-[80vh] flex flex-col"><div class="p-3 border-b bg-gray-100 flex justify-between"><span class="font-bold">${ta} x ${tb}</span><button onclick="closeModal()">X</button></div><div id="chatBox" class="flex-1 overflow-y-auto p-3 bg-gray-50"></div><div class="p-2 border-t flex gap-2"><input id="chatIn" class="flex-1 border rounded px-2"><button onclick="sendChat('${mid}')" class="bg-green-700 text-white px-4 rounded">></button></div></div>`;
            
            // Marca lido
            localStorage.setItem(`read_count_${mid}`, globalServerCounts[mid]||0);
            updateBadges();

            const q = query(collection(db, "match_comments"), where("matchId", "==", mid), orderBy("timestamp", "asc"));
            onSnapshot(q, (snap) => {
                const box = document.getElementById('chatBox');
                if(!box) return;
                box.innerHTML = snap.docs.map(d => {
                    const data = d.data();
                    const isMe = data.userId === currentUser.uid;
                    return `<div class="mb-2 flex flex-col ${isMe?'items-end':'items-start'}"><span class="text-[10px] text-gray-500">${data.userName}</span><div class="bg-${isMe?'green-100':'white'} border p-2 rounded max-w-[80%] text-sm">${data.text}</div></div>`;
                }).join('');
                box.scrollTop = box.scrollHeight;
            });

            window.sendChat = async (mid) => {
                const t = document.getElementById('chatIn').value;
                if(!t) return;
                const u = await getDoc(doc(db, "users", currentUser.uid));
                await addDoc(collection(db, "match_comments"), {
                    matchId: mid, userId: currentUser.uid, userName: u.data().name, text: t, timestamp: new Date(), likes: []
                });
                document.getElementById('chatIn').value = "";
            }
        };
        
        window.openVoters = async (mid, ta, tb, ua, ub, exp, win) => {
             const m = document.getElementById('modalOverlay'); m.classList.remove('hidden');
             const c = document.getElementById('modalContainer');
             c.innerHTML = '<div class="bg-white p-4">Carregando...</div>';
             
             const [users, guesses] = await Promise.all([getDocs(collection(db,"users")), getDocs(query(collection(db,"guesses"), where("matchId","==",mid)))]);
             let list = [];
             guesses.forEach(g => {
                 const gd = g.data();
                 const u = users.docs.find(x => x.id === gd.userId)?.data() || {name:"?"};
                 list.push({name:u.name, team:gd.teamSelected});
             });
             
             let h = `<div class="bg-white max-h-[80vh] overflow-y-auto"><div class="p-3 bg-green-700 text-white flex justify-between"><span>Palpites</span><button onclick="closeModal()">X</button></div>`;
             list.forEach(i => {
                 let extra = "";
                 if(!exp) extra = "🔒 Sigilo";
                 else extra = i.team;
                 h += `<div class="p-2 border-b flex justify-between"><span>${i.name}</span><span class="font-bold">${extra}</span></div>`;
             });
             h += "</div>";
             c.innerHTML = h;
        };
        
        // --- FUNÇÕES DE PERFIL E ADMIN (Básicas para funcionar) ---
        window.showModalPhoto = (idx) => {
            const u = currentRankingData[idx];
            // Implementar modal simples se precisar
            alert(`Perfil de ${u.name}\nPontos: ${u.pts}`);
        };
        document.getElementById('btnRefresh').onclick = () => loadMatches();
        document.getElementById('btnLogout').onclick = () => signOut(auth);

        // Funções Admin (Placeholder)
        window.openAdminMenu = () => alert("Use o App Android.");
        document.getElementById('btnPot').onclick = () => { calculatePot(); document.getElementById('potModal').classList.remove('hidden'); };

    </script>
</body>
</html>
